name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff, sqlfluff, mypy, marimo)
        run: make lint

      - name: Tests (offline)
        run: uv run pytest -m "not network" --cov --cov-report=term-missing

      - name: End-to-end pipeline
        run: uv run dengue-pipeline run
